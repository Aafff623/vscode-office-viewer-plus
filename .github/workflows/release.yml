name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Secrets cannot be read in step-level `if:` conditions; mapping them to
    # job-level env lets the steps below test `env.VSCE_PAT != ''`.
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Package extension
        run: npx @vscode/vsce package --no-git-tag-version --out vscode-office-viewer-plus.vsix

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: vscode-office-viewer-plus.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npx @vscode/vsce publish --packagePath vscode-office-viewer-plus.vsix --skip-duplicate

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx ovsx publish --packagePath vscode-office-viewer-plus.vsix --skip-duplicate
